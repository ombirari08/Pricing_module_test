<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pricing Calculator</h2>
        <form id="pricingForm" method="POST">
            {% csrf_token %}
            <label for="day_of_week">Day of Week</label>
            <input type="text" id="day_of_week" name="day_of_week" placeholder="Enter the day of the week (e.g., Monday)" required>
            
            <label for="distance_traveled">Distance Traveled (km)</label>
            <input type="number" id="distance_traveled" name="distance_traveled" placeholder="Distance in kilometers" required>

            <label for="time_duration">Time Duration (minutes)</label>
            <input type="number" id="time_duration" name="time_duration" placeholder="Time in minutes" required>

            <label for="waiting_time">Waiting Time (minutes)</label>
            <input type="number" id="waiting_time" name="waiting_time" placeholder="Waiting time in minutes" required>

            <button type="submit">Calculate Price</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('pricingForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let formData = new FormData(this);
            let data = {
                "day_of_week": formData.get('day_of_week'),
                "distance_traveled": formData.get('distance_traveled'),
                "time_duration": formData.get('time_duration'),
                "waiting_time": formData.get('waiting_time')
            };

            fetch('/api/calculate-price/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')  // Include the CSRF token
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.total_price) {
                    document.getElementById('result').innerHTML = `<h3>Total Price: ₹${data.total_price}</h3>`;
                } else {
                    document.getElementById('result').innerHTML = `<h3>Error: ${data.error}</h3>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `<h3>Error calculating price.</h3>`;
            });
        });

        // Function to get the CSRF token from the cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

</body>
</html>
